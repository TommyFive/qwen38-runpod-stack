name: Qwen38 image build (GitHub-hosted candidate)

# Large builds must be explicitly requested, never triggered by code pushes.
# Label "run-qwen38-image-build" on PR #21 to start a candidate build. Remove
# and re-add the label for a subsequent run. GHCR publishing is dispatch-only.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Explicitly publish candidate to GHCR (false = build only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write # Periodic resource snapshots in PR #21 comment; no raw build logs
  pull-requests: write
  packages: write

concurrency:
  group: qwen38-image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-qwen38-image-build' &&
       github.event.pull_request.number == 21 &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Offline source and safety checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n images/sglang-qwen38/build-image.sh
          python3 -m unittest discover -v -s images/sglang-qwen38/tests -p 'test_*.py'
      - name: Verify PR status-write authorization before costly Docker work
        if: github.event_name == 'pull_request'
        id: status-preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          repo = os.environ["REPOSITORY"]
          number = int(os.environ["PR_NUMBER"])
          if repo != "TommyFive/qwen38-runpod-stack" or number != 21:
              raise SystemExit("Refusing status probe outside approved repo/PR")
          url = f"https://api.github.com/repos/{repo}/issues/{number}/comments"
          body = (
              "<!-- qwen38-image-resource-watch -->\n"
              f"Qwen38 image run {os.environ['RUN_ID']}: status authentication verified. "
              "Build has not started. Resource heartbeat every 120 seconds, "
              "then every 30 seconds after minute 30."
          )
          request = urllib.request.Request(
              url, data=json.dumps({"body": body}).encode(), method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  if response.status != 201:
                      raise SystemExit(f"PR comment probe unexpected HTTP {response.status}")
                  comment_id = int(json.load(response)["id"])
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
                      out.write(f"comment_id={comment_id}\n")
                  print(f"PASS: PR status-write preflight HTTP 201, comment #{comment_id}")
          except urllib.error.HTTPError as exc:
              print(f"::error::PR status comment unavailable (HTTP {exc.code}); "
                    "aborting before the expensive image build.")
              raise SystemExit(1)
          except (urllib.error.URLError, KeyError, ValueError, TimeoutError) as exc:
              print(f"::error::PR status comment preflight error "
                    f"({type(exc).__name__}); aborting before image build.")
              raise SystemExit(1)
          PY
      - name: Free unneeded preinstalled SDKs on ephemeral GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          echo "=== BEFORE ==="
          df -h / /var/lib/docker
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          echo "=== AFTER ==="
          df -h / /var/lib/docker
      - name: Verify Docker storage and build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "=== HOSTED RUNNER ==="
          uname -a
          docker version
          docker buildx version
          df -hT / /var/lib/docker
          free -h
          root="$(docker info --format '{{.DockerRootDir}}')"
          available="$(df -B1 --output=avail "$root" | tail -1 | tr -d ' ')"
          threshold="$((100 * 1024 * 1024 * 1024))"
          echo "DockerRoot=$root AvailableBytes=$available RequiredBytes=$threshold"
          if (( available < threshold )); then
            echo "::error::Insufficient disk for conservative SGLang CUDA build; aborting before image pull/compile"
            exit 1
          fi
      - name: Build pinned AMD64 candidate with durable telemetry
        shell: bash
        env:
          IMAGE_TAG: ghcr.io/tommyfive/qwen38-sglang:candidate-${{ github.event.pull_request.head.sha || github.sha }}
          PUBLISH_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          QWEN38_STATUS_COMMENT_ID: ${{ steps.status-preflight.outputs.comment_id }}
        run: |
          set -Eeuo pipefail
          log_dir="$RUNNER_TEMP/qwen38-image"
          mkdir -p "$log_dir"
          log="$log_dir/buildkit.log"
          : > "$log"
          echo "BuildKit plain text output is retained as an artifact on normal job exit."
          echo "PR heartbeat: 120s initially, 30s after minute 30; SSD/RAM sample in Actions every 30s."
          if [[ "$PUBLISH_IMAGE" == true ]]; then
            printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          fi
          export BUILDKIT_PROGRESS=plain
          if [[ "$PUBLISH_IMAGE" == true ]]; then
            setsid env -u GH_TOKEN -u GITHUB_TOKEN \
              QWEN38_IMAGE_PUBLISH=YES \
              bash images/sglang-qwen38/build-image.sh --tag "$IMAGE_TAG" --push \
              >"$log" 2>&1 &
          else
            setsid env -u GH_TOKEN -u GITHUB_TOKEN \
              bash images/sglang-qwen38/build-image.sh --tag "$IMAGE_TAG" \
              >"$log" 2>&1 &
          fi
          build_pid=$!
          echo "Build started as isolated process group, pid=$build_pid"
          python3 images/sglang-qwen38/watch-build.py \
            --pid "$build_pid" --log "$log" --run-id "$RUN_ID" \
            --interval 30 --heartbeat 120 --heartbeat-after-30m 30 \
            --fast-start-seconds 1800 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          set +e
          wait "$build_pid"
          build_status=$?
          set -e
          echo "Build exit code: $build_status"
          echo "=== Last 80 build log lines ==="
          tail -n 80 "$log" || true
          if (( build_status == 0 )); then
            echo "Built candidate: $IMAGE_TAG; published=$PUBLISH_IMAGE"
            if [[ "$PUBLISH_IMAGE" != true ]]; then
              docker image inspect "$IMAGE_TAG" \
                --format 'ImageId={{.Id}} UncompressedBytes={{.Size}}'
            fi
          fi
          echo "=== POST-BUILD RESOURCES ==="
          df -h / /var/lib/docker || true
          free -h || true
          exit "$build_status"

      - name: Preserve full Docker BuildKit log (normal and failed exits)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qwen38-image-buildkit-${{ github.run_id }}
          path: ${{ runner.temp }}/qwen38-image/buildkit.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
