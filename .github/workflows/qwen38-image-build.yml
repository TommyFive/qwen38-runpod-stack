name: Qwen38 image build (GitHub-hosted candidate)

# Large builds must be explicitly requested, never triggered by code pushes.
# Label "run-qwen38-image-build" on PR #21 to start a candidate build. Remove
# and re-add the label for a subsequent run. GHCR publishing is dispatch-only.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Explicitly publish candidate to GHCR (false = build only)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: qwen38-image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'run-qwen38-image-build' &&
       github.event.pull_request.number == 21 &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Offline source and safety checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n images/sglang-qwen38/build-image.sh
          python3 -m unittest discover -v -s images/sglang-qwen38/tests -p 'test_*.py'
      - name: Free unneeded preinstalled SDKs on ephemeral GitHub-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          echo "=== BEFORE ==="
          df -h / /var/lib/docker
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          echo "=== AFTER ==="
          df -h / /var/lib/docker
      - name: Verify Docker storage and build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "=== HOSTED RUNNER ==="
          uname -a
          docker version
          docker buildx version
          df -hT / /var/lib/docker
          free -h
          root="$(docker info --format '{{.DockerRootDir}}')"
          available="$(df -B1 --output=avail "$root" | tail -1 | tr -d ' ')"
          threshold="$((100 * 1024 * 1024 * 1024))"
          echo "DockerRoot=$root AvailableBytes=$available RequiredBytes=$threshold"
          if (( available < threshold )); then
            echo "::error::Insufficient disk for conservative SGLang CUDA build; aborting before image pull/compile"
            exit 1
          fi
      - name: Build pinned AMD64 candidate (publish optional)
        shell: bash
        env:
          IMAGE_TAG: ghcr.io/tommyfive/qwen38-sglang:candidate-${{ github.event.pull_request.head.sha || github.sha }}
          PUBLISH_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_IMAGE" == true ]]; then
            printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            QWEN38_IMAGE_PUBLISH=YES bash images/sglang-qwen38/build-image.sh --tag "$IMAGE_TAG" --push
          else
            bash images/sglang-qwen38/build-image.sh --tag "$IMAGE_TAG"
          fi
          echo "Built candidate tag: $IMAGE_TAG; published=$PUBLISH_IMAGE"
          if [[ "$PUBLISH_IMAGE" != true ]]; then
            docker image inspect "$IMAGE_TAG" --format 'ImageId={{.Id}} UncompressedBytes={{.Size}}'
            docker history --human=false "$IMAGE_TAG" | head -n 20 || true
          fi
          df -h / /var/lib/docker
