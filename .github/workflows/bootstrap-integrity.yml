name: Bootstrap integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Syntax and Python compilation
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/bootstrap-sglang-openwebui.sh
          bash -n scripts/tailscale-runtime.sh
          bash -n bin/qwen38fast
          bash -n setup.sh
          bash -n create-templates.sh
          python3 -m py_compile scripts/private-template-ports.py
          for script in tests/*.sh; do bash -n "$script"; done
          python3 -m compileall -q bin/qwen38cold bin/qwen38bench bin/qwen38-proxy scripts tests
      - name: Keep isolated UI environment
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*(pip|python3?[[:space:]]+-m[[:space:]]+pip)[[:space:]]+install' scripts/bootstrap-sglang-openwebui.sh; then
            echo 'Unisolated pip install found in SGLang bootstrap' >&2
            exit 1
          fi
          grep -Fq 'uv venv --python /usr/bin/python3 "$WEBUI_VENV"' scripts/bootstrap-sglang-openwebui.sh
          grep -Fq 'uv pip install --python "$WEBUI_VENV/bin/python"' scripts/bootstrap-sglang-openwebui.sh
      - name: Security / privacy contracts
        shell: bash
        run: bash tests/test-privacy.sh
      - name: Tailscale native SSH contracts
        shell: bash
        run: bash tests/test-tailscale.sh
      - name: Public vs portless private template / launcher
        shell: bash
        run: bash tests/test-launch-network.sh
      - name: Model storage launcher / template contracts
        shell: bash
        run: bash tests/test-storage-integration.sh
      - name: Python integration and regression
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
