name: Verify GHCR package write capability
on:
  push:
    branches: [research/minimal-v2-kernel-audit]
    paths: [.github/workflows/qwen38-ghcr-permission-probe.yml]

permissions:
  contents: read
  packages: write

jobs:
  check:
    if: github.repository == 'TommyFive/qwen38-runpod-stack'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate with scoped Actions token
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | docker login ghcr.io -u TommyFive --password-stdin
      - name: Publish tiny GitHub-owned checkpoint package probe
        run: |
          set -euo pipefail
          mkdir /tmp/qwen38-ghcr-probe
          printf 'FROM scratch\nLABEL org.opencontainers.image.source="https://github.com/TommyFive/qwen38-runpod-stack"\nLABEL ai.qwen38.purpose="temporary-package-permission-check"\n' > /tmp/qwen38-ghcr-probe/Dockerfile
          docker build -t ghcr.io/tommyfive/qwen38-minimal-v2-checkpoint:permission-probe-20261012 /tmp/qwen38-ghcr-probe
          docker push ghcr.io/tommyfive/qwen38-minimal-v2-checkpoint:permission-probe-20261012
          docker manifest inspect ghcr.io/tommyfive/qwen38-minimal-v2-checkpoint:permission-probe-20261012 >/dev/null
