name: Qwen38 image source checks

on:
  push:
    paths:
      - 'images/sglang-qwen38/**'
      - '.github/workflows/qwen38-image-*.yml'
  pull_request:
    paths:
      - 'images/sglang-qwen38/**'
      - '.github/workflows/qwen38-image-*.yml'

permissions:
  contents: read

jobs:
  image-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
      - name: Inspect hosted runner capacity (read-only, no image build)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== RUNNER ==="
          uname -a
          echo "=== FILESYSTEMS ==="
          df -hT / "$RUNNER_TEMP" /var/lib/docker || true
          echo "=== BLOCK DEVICES ==="
          lsblk -o NAME,SIZE,TYPE,MOUNTPOINTS || true
          echo "=== MEMORY ==="
          free -h
          echo "=== DOCKER ROOT ==="
          docker info --format 'DockerRootDir={{.DockerRootDir}}' || true
          echo "=== AVAILABLE SPACE ==="
          df -B1 --output=target,size,avail / | tail -n 1
      - name: Lint build entrypoint and Python syntax
        run: |
          set -euo pipefail
          bash -n images/sglang-qwen38/build-image.sh
          bash -n images/sglang-qwen38/create-candidate-template.sh
          bash -n images/sglang-qwen38/cloudzy/bootstrap-and-start.sh
          bash -n images/sglang-qwen38/cloudzy/start-from-mac.sh
          bash -n images/sglang-qwen38/cloudzy/monitor-from-mac.sh
          bash -n images/sglang-qwen38/cloudzy/run-build.sh
          python3 -m py_compile images/sglang-qwen38/manifest-size.py
          python3 -m py_compile images/sglang-qwen38/inspect-ghcr-size.py
          python3 -m py_compile images/sglang-qwen38/cloudzy/observer.py
          python3 -m py_compile images/sglang-qwen38/prepare-source.py
          python3 -m py_compile images/sglang-qwen38/tests/test_prepare_source.py
      - name: Verify pinned build overlay (offline, no Docker/GPU)
        run: |
          set -euo pipefail
          python3 -m unittest discover -v \
            -s images/sglang-qwen38/tests -p 'test_*.py'


  # No expensive image build or container download: read only registry metadata.
  # The GITHUB_TOKEN can read GHCR only if the private package grants repo access.
  ghcr-manifest-size:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 21 &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Read compressed GHCR candidate manifest without pulling layers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_REF: ghcr.io/tommyfive/qwen38-sglang@sha256:1dc683600229c0c34d8df7eb322c6cbf36f677c22d216625df1e3892ae32a7fd
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-inspect-config"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG"' EXIT
          if ! printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin; then
            echo "::warning::GHCR token login refused. Package may not grant Actions read access."
            exit 0
          fi
          if ! docker buildx imagetools inspect --raw "$IMAGE_REF" > "$RUNNER_TEMP/qwen38-ghcr-manifest.json"; then
            echo "::warning::Private GHCR package not accessible to this repository's GITHUB_TOKEN. Grant package Actions access to TommyFive/qwen38-runpod-stack to measure without a PAT."
            exit 0
          fi
          python3 images/sglang-qwen38/manifest-size.py "$RUNNER_TEMP/qwen38-ghcr-manifest.json"
