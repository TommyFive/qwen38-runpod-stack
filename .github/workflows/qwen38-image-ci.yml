name: Qwen38 image source checks

on:
  push:
    paths:
      - 'images/sglang-qwen38/**'
      - '.github/workflows/qwen38-image-*.yml'
  pull_request:
    paths:
      - 'images/sglang-qwen38/**'
      - '.github/workflows/qwen38-image-*.yml'

permissions:
  contents: read

jobs:
  image-metadata-audit:
    # GitHub Actions has a dedicated read permission for the private GHCR
    # package, independently of its future public visibility.
    # This reads one manifest + its tiny OCI config, never the image layers.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Review published container metadata for build-time secrets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          python3 images/sglang-qwen38/tools/audit-image-config.py
  image-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
      - name: Inspect hosted runner capacity (read-only, no image build)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== RUNNER ==="
          uname -a
          echo "=== FILESYSTEMS ==="
          df -hT / "$RUNNER_TEMP" /var/lib/docker || true
          echo "=== BLOCK DEVICES ==="
          lsblk -o NAME,SIZE,TYPE,MOUNTPOINTS || true
          echo "=== MEMORY ==="
          free -h
          echo "=== DOCKER ROOT ==="
          docker info --format 'DockerRootDir={{.DockerRootDir}}' || true
          echo "=== AVAILABLE SPACE ==="
          df -B1 --output=target,size,avail / | tail -n 1
      - name: Lint build entrypoint and Python syntax
        run: |
          set -euo pipefail
          find images/sglang-qwen38 -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          python3 -m compileall -q images/sglang-qwen38
      - name: Verify pinned build overlay (offline, no Docker/GPU)
        run: |
          set -euo pipefail
          python3 -m unittest discover -v \
            -s images/sglang-qwen38/tests -p 'test_*.py'
