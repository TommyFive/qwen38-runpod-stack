name: Qwen38 image source checks

on:
  push:
    paths:
      - 'images/sglang-qwen38/**'
      - '.github/workflows/qwen38-image-*.yml'
  pull_request:
    paths:
      - 'images/sglang-qwen38/**'
      - '.github/workflows/qwen38-image-*.yml'

permissions:
  contents: read

jobs:
  image-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (Node 24)
      - name: Inspect hosted runner capacity (read-only, no image build)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== RUNNER ==="
          uname -a
          echo "=== FILESYSTEMS ==="
          df -hT / "$RUNNER_TEMP" /var/lib/docker || true
          echo "=== BLOCK DEVICES ==="
          lsblk -o NAME,SIZE,TYPE,MOUNTPOINTS || true
          echo "=== MEMORY ==="
          free -h
          echo "=== DOCKER ROOT ==="
          docker info --format 'DockerRootDir={{.DockerRootDir}}' || true
          echo "=== AVAILABLE SPACE ==="
          df -B1 --output=target,size,avail / | tail -n 1
      - name: Lint build entrypoint and Python syntax
        run: |
          set -euo pipefail
          bash -n images/sglang-qwen38/build-image.sh
          python3 -m py_compile images/sglang-qwen38/prepare-source.py
          python3 -m py_compile images/sglang-qwen38/tests/test_prepare_source.py
      - name: Verify pinned build overlay (offline, no Docker/GPU)
        run: |
          set -euo pipefail
          python3 -m unittest discover -v \
            -s images/sglang-qwen38/tests -p 'test_*.py'

  pr-comment-permission-probe:
    # Separate, no-checkout job. Never execute PR-controlled code with write token.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 21 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Verify same-repo Actions token can create a PR status comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          repo = os.environ["REPOSITORY"]
          number = int(os.environ["PR_NUMBER"])
          assert repo == "TommyFive/qwen38-runpod-stack" and number == 21
          url = f"https://api.github.com/repos/{repo}/issues/{number}/comments"
          body = (
              "<!-- qwen38-image-permissions-canary -->\n"
              "Qwen38 image diagnostics: isolated GitHub Actions permission "
              "probe (no Docker build). "
              "The PR-comment API call succeeded if this comment is visible. "
              f"CI run: {os.environ['RUN_URL']}"
          )
          request = urllib.request.Request(
              url,
              data=json.dumps({"body": body}).encode(),
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  assert response.status == 201, f"Unexpected HTTP {response.status}"
                  print("PASS: created PR canary comment (HTTP 201)")
          except urllib.error.HTTPError as error:
              # Emit only allowlisted GitHub error metadata, never tokens,
              # request URLs or raw error payload.
              try:
                  payload = json.loads(error.read(4096).decode("utf-8", errors="replace"))
                  reason = payload.get("message", "unknown")
                  permitted = ("Resource not accessible by integration",
                               "API rate limit exceeded", "Validation Failed",
                               "You have triggered an abuse detection mechanism",
                               "Forbidden", "Must have admin rights to Repository.")
                  reason = reason if any(reason.startswith(p) for p in permitted) else "other"
              except (ValueError, TypeError, UnicodeError):
                  reason = "unparseable"
              accepted = error.headers.get("x-accepted-github-permissions", "unknown")
              if len(accepted) > 120:
                  accepted = "too long"
              print(f"FAIL: PR-comment HTTP {error.code}; reason={reason}; "
                    f"accepted-permissions={accepted}")
              raise SystemExit(1)
          except urllib.error.URLError as error:
              print(f"FAIL: PR-comment write API transport ({type(error).__name__})")
              raise SystemExit(1)
          PY
